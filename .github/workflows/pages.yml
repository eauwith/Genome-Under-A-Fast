name: Deploy to GitHub Pages

# NOT triggered automatically. GitHub Pages is unavailable for private
# repositories on the Free plan, so this would fail on every push while the
# repo stays private. It is ready to use the moment either is true:
#   * the repository is made public (Settings → General → Danger Zone), or
#   * the account moves to GitHub Pro.
# Then set Settings → Pages → Source = "GitHub Actions" and run this manually,
# or add a `push: branches: [main]` trigger to make deploys automatic.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Pages is available
    runs-on: ubuntu-latest
    steps:
      - name: Fail early with a useful message
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::GitHub Pages is not available for private repositories on the Free plan."
          echo "::error::Make the repository public, or upgrade to GitHub Pro, then re-run."
          exit 1

  deploy:
    name: Build & deploy
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:artifact
      - run: npm run check

      # Serve the standalone page as the site root, so the deployed site needs
      # no separate asset requests.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/artifact.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
